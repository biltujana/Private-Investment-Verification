name: CI/CD Pipeline - Private Investment Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compile-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compact Contract Compilation & Verification
        run: npm run compile:compact

      - name: Verify Contract Artifacts
        run: |
          echo "=== Checking Managed Artifacts ==="
          ls -la managed/compiler/
          ls -la managed/contract/
          ls -la managed/keys/
          ls -la managed/zkir/
          test -f managed/compiler/contract-info.json
          test -f managed/contract/index.d.ts
          test -f managed/contract/index.js
          echo "All managed contract artifacts verified successfully."

      - name: Run Vitest Unit & Integration Tests (34 Tests)
        run: npm test

      - name: Build Next.js Web Platform
        run: npm run build