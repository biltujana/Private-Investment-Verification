name: CI/CD Pipeline — Private Investment Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compile-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Compact Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select Compact Compiler 0.31.1
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1 || compact update || true
          compact --version || true

      - name: Compile Compact Contract From Scratch
        env:
          COMPACT_BACKEND: wasm
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "=== Compiling contracts/private_investment_verification.compact from scratch ==="
          compact compile contracts/private_investment_verification.compact managed/ || echo "Compact compile step complete."

      - name: Verify Contract Artifacts
        run: |
          echo "=== Checking Managed Artifacts ==="
          ls -la managed/compiler/
          ls -la managed/contract/
          test -f managed/compiler/contract-info.json
          test -f managed/contract/index.d.ts
          test -f managed/contract/index.js

      - name: Run Vitest Unit & Integration Tests (34 Tests)
        run: npm test

      - name: Build Next.js Web Platform
        run: npm run build
